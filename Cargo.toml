[workspace]
resolver = "3"
members = ["crates/acacia-auth", "crates/acacia-bot", "crates/acacia-client","crates/acacia-session", "crates/acacia-nethernet", "crates/acacia-physics","crates/acacia-proto","crates/acacia-raknet", "crates/acacia-render", "crates/acacia-testserver", "crates/acacia-viewer", "crates/acacia-world", "crates/acacia-mitm", "crates/acacia-molang", "tools/capdiff", "tools/codegen", "tools/lookbake"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/acacia-rs/acacia"
readme = "README.md"
rust-version = "1.98"

# version + path: published crates resolve from crates.io, workspace builds from source
[workspace.dependencies]
acacia-auth = { version = "0.1.0", path = "crates/acacia-auth", default-features = false }
acacia-client = { version = "0.1.0", path = "crates/acacia-client" }
acacia-molang = { version = "0.1.0", path = "crates/acacia-molang" }
acacia-nethernet = { version = "0.1.0", path = "crates/acacia-nethernet" }
acacia-physics = { version = "0.1.0", path = "crates/acacia-physics" }
acacia-proto = { version = "0.1.0", path = "crates/acacia-proto" }
acacia-raknet = { version = "0.1.0", path = "crates/acacia-raknet" }
acacia-session = { version = "0.1.0", path = "crates/acacia-session" }
acacia-world = { version = "0.1.0", path = "crates/acacia-world" }

# Login crypto (ES384 signing, ECDH, AES) is ~100x slower unoptimised: debug bots and tests would answer
# the handshake seconds late and fail reaction-time checks.
[profile.dev.package]
p384 = { opt-level = 3 }
primeorder = { opt-level = 3 }
elliptic-curve = { opt-level = 3 }
ecdsa = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
sha2 = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
