[workspace]
resolver = "3"
members = ["crates/acacia-auth", "crates/acacia-bot", "crates/acacia-client","crates/acacia-session", "crates/acacia-nethernet", "crates/acacia-physics","crates/acacia-proto","crates/acacia-raknet", "crates/acacia-testserver", "crates/acacia-world", "crates/acacia-mitm", "tools/capdiff", "tools/codegen"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

# Login crypto (ES384 signing, ECDH, AES) is ~100x slower unoptimised: debug bots and tests would answer
# the handshake seconds late and fail reaction-time checks.
[profile.dev.package]
p384 = { opt-level = 3 }
primeorder = { opt-level = 3 }
elliptic-curve = { opt-level = 3 }
ecdsa = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
sha2 = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
