[package]
name = "lookbake"
version = "0.1.0"
edition.workspace = true
# Not the workspace's MIT: src/model is ported from Pomme (LICENSE-pomme). Nothing depends on this
# crate; the renderer reads only the packs it writes (docs/java-look.md "Licensing").
license = "GPL-3.0-or-later"
publish = false
rust-version.workspace = true

[dependencies]
acacia-render = { path = "../../crates/acacia-render" }
acacia-world.workspace = true
flate2 = "1"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
