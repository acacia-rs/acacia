[package]
name = "acacia-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
# Heap accounting by thread role, logged with the periodic stats (src/heap.rs).
profile = []

[dependencies]
acacia-bot = { path = "../acacia-bot" }
acacia-render = { path = "../acacia-render" }
acacia-sound = { path = "../acacia-sound" }
acacia-ui = { path = "../acacia-ui" }
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
acacia-world.workspace = true
glam = "0.33"
memory-stats = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
winit = "0.30"
