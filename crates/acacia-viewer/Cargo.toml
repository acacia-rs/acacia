[package]
name = "acacia-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
acacia-bot = { path = "../acacia-bot" }
acacia-render = { path = "../acacia-render" }
acacia-world = { path = "../acacia-world" }
glam = "0.33"
memory-stats = "1"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
winit = "0.30"
