[package]
name = "acacia-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["online"]
# Network auth: AuthClient, device code, Xbox/PlayFab/session token chain, Account.
online = ["dep:reqwest", "dep:tokio", "dep:p256", "dep:httpdate", "dep:url", "dep:time"]
# Lets AuthConfig::proxy take socks5:// URLs.
socks = ["online", "reqwest/socks"]

[dependencies]
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

httpdate = { version = "1", optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
url = { version = "2", optional = true }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[[example]]
name = "device_login"
required-features = ["online"]
