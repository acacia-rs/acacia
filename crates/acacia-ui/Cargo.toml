[package]
name = "acacia-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "HUD, chat and menus laid out as draw lists, in a Java or Bedrock theme; no GPU"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
