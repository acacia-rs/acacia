[package]
name = "acacia-nethernet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Exposes sign_as_server so other crates' tests can stand in for a NetherNet host.
test-support = []

[dependencies]
# rust-crypto: pure-Rust DTLS, no system OpenSSL or C toolchain.
str0m = { version = "0.24.0", default-features = false, features = ["rust-crypto"] }
bytes = "1.12.1"
base64 = "0.22"
serde_json = "1"
# Keep p384 in step with acacia-auth: the login SigningKey signs the identity assertion.
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Same version/features dimpl already builds (aws-lc-rs signing).
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
time = "0.3"
thiserror = "2.0.21"
tracing = "0.1.44"
# STUN/TURN client (turn/): MESSAGE-INTEGRITY, long-term key, FINGERPRINT.
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc = "3"
# LAN discovery (lan/): AES-256-ECB + HMAC-SHA256.
aes = "0.8"
sha2 = "0.10"
