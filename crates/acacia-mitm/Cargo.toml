[package]
name = "acacia-mitm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
acacia-raknet = { path = "../acacia-raknet" }
acacia-session = { path = "../acacia-session" }
acacia-proto = { path = "../acacia-proto" }
acacia-auth = { path = "../acacia-auth" }
acacia-nethernet = { path = "../acacia-nethernet" }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
bytes = "1.12.1"
p384 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
