[package]
name = "acacia-mitm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Man-in-the-middle proxy for Minecraft: Bedrock Edition over RakNet or NetherNet: record, drop, rewrite and inject packets"
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[dependencies]
acacia-raknet.workspace = true
acacia-session.workspace = true
acacia-proto.workspace = true
acacia-auth = { workspace = true, features = ["online"] }
acacia-nethernet.workspace = true
# For realms: asking Realms where one is, and the raw link to it.
acacia-client.workspace = true
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
bytes = "1.12.1"
p384 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
mimalloc = { version = "0.1.52", optional = true }

[features]
default = ["mimalloc"]
# The CLI's allocator (docs/proto.md, "Decode cost"). Library users can drop it with `default-features = false`.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
acacia-testserver = { path = "../acacia-testserver" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
