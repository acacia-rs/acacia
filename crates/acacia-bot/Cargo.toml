[package]
name = "acacia-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "High-level Minecraft: Bedrock Edition bot built on acacia-client"
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
# Sign-in through the game connection's SOCKS5 proxy (see acacia-client's `socks`).
socks = ["acacia-client/socks"]

[dependencies]
acacia-client.workspace = true
acacia-physics.workspace = true
acacia-world.workspace = true
async-trait = "0.1"
bytes = "1.12.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
acacia-world = { path = "../acacia-world" }
acacia-testserver = { path = "../acacia-testserver" }
