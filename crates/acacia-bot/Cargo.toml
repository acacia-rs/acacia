[package]
name = "acacia-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Sign-in through the game connection's SOCKS5 proxy (see acacia-client's `socks`).
socks = ["acacia-client/socks"]

[dependencies]
acacia-client = { path = "../acacia-client" }
acacia-physics = { version = "0.1.0", path = "../acacia-physics" }
acacia-world = { version = "0.1.0", path = "../acacia-world" }
bytes = "1.12.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
regex = "1"
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
acacia-world = { path = "../acacia-world" }
acacia-testserver = { path = "../acacia-testserver" }
