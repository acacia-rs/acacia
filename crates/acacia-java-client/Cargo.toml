[package]
name = "acacia-java-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minecraft: Java Edition 26.3 client connection"
repository.workspace = true
rust-version.workspace = true

[dependencies]
acacia-auth = { path = "../acacia-auth" }
acacia-java-proto = { path = "../acacia-java-proto" }
aes = "0.8"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
md-5 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "pem"] }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["net", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
acacia-registry = { path = "../acacia-registry" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
