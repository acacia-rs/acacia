[package]
name = "acacia-anvil"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bedrock chunks from acacia-world written out as a Java Edition Anvil world (.mca region files)"
repository.workspace = true
rust-version.workspace = true

[dependencies]
acacia-nbt.workspace = true
acacia-world.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
thiserror = "2"

[dev-dependencies]
acacia-bot = { path = "../acacia-bot" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
